[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
android-minSdk = "24"

android-compileSdk = "37"
vanniktechMavenPublish = "0.37.0"

coreKtx = "1.19.1"
junit = "4.13.2"
